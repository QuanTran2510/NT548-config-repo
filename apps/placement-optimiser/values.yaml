# Owned by CI: the deploy job rewrites repository and tag on every merge to main.
image:
  repository: ghcr.io/quantran2510/placement-optimiser
  tag: "cd8c827"
containerPort: 8000
probes:
  path: /healthz
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}
env:
  - name: PORTAL_REPO
    value: QuanTran2510/NT548-config-repo
  - name: GITHUB_TOKEN
    valueFrom:
      secretKeyRef:
        name: portal-github
        key: token
        optional: true
