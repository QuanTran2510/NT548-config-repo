# Created by the portal for service 'voting-result' (owner: team-voting).
# The service team / its CI owns image.tag. Placement lives in envs/ and is written by the optimiser.
image:
  repository: ghcr.io/quantran2510/voting-result
  tag: "v4"
containerPort: 80
probes:
  path: /
env:
  - name: POSTGRES_HOST
    value: "db.data-tier.svc.cluster.local"
  - name: POSTGRES_USER
    value: "postgres"
  - name: POSTGRES_PASSWORD
    value: "postgres"
