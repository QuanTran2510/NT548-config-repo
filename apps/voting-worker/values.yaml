# Created by the portal for service 'voting-worker' (owner: team-voting).
# The service team / its CI owns image.tag. Placement lives in envs/ and is written by the optimiser.
image:
  repository: ghcr.io/quantran2510/voting-worker
  tag: "v4"
containerPort: 80
probes:
  path: /
env:
  - name: REDIS_HOST
    value: "redis.data-tier.svc.cluster.local"
  - name: POSTGRES_HOST
    value: "db.data-tier.svc.cluster.local"
