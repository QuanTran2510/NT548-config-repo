# One Application per envs/<service>-<site>/values.yaml file (generated by the optimiser).
# New file in Git -> new Application; file deleted -> Application (and its pods) pruned.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/YOUR_USER/config-repo.git   # TODO: change
        revision: main
        files:
          - path: "envs/*/values.yaml"
  template:
    metadata:
      name: '{{ .service }}-{{ .site }}'
      labels:
        platform/service: '{{ .service }}'
        platform/site: '{{ .site }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/YOUR_USER/config-repo.git   # TODO: change
        targetRevision: main
        path: charts/service
        helm:
          valueFiles:
            - ../../apps/{{ .service }}/values.yaml
            - ../../envs/{{ .path.basename }}/values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .service }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
