- name: Create k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Write k3s server config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  register: k3s_conf

- name: Install k3s server
  ansible.builtin.shell: curl -sfL https://get.k3s.io | INSTALL_K3S_CHANNEL={{ k3s_channel }} sh -s - server
  args:
    creates: /usr/local/bin/k3s

- name: Restart k3s if its config changed
  ansible.builtin.systemd:
    name: k3s
    state: restarted
  when: k3s_conf.changed

- name: Wait until the server node is Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=20s
  register: ready
  retries: 12
  delay: 5
  until: ready.rc == 0
  changed_when: false

- name: Download kubeconfig to the control machine
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ playbook_dir }}/kubeconfig"
    flat: true

- name: Point kubeconfig at the Elastic IP instead of 127.0.0.1
  ansible.builtin.replace:
    path: "{{ playbook_dir }}/kubeconfig"
    regexp: "https://127.0.0.1:6443"
    replace: "https://{{ ansible_host }}:6443"
  delegate_to: localhost
  become: false
