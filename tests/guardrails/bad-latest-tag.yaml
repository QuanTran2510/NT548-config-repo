apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrail-test
  namespace: web-api
  labels:
    app: guardrail-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guardrail-test
  template:
    metadata:
      labels:
        app: guardrail-test
    spec:
      containers:
      - name: app
        image: ghcr.io/quantran2510/placement-optimiser:latest
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
